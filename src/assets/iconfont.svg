     iconfont.svg —— 图标雪碧图(sprite)：一个文件装全部界面小图标
     机制：
     1. main.ts 用 ?raw 读成字符串，innerHTML 注入 DOM
        （svg 被藏起来，但里面所有 <symbol> 已注册进页面，全局可引用）
     2. AppIcon.vue 用 <use href="#icon-xxx"> 按 id 复印出对应图标
     规则：
     · 每个 <symbol> 是一个图标，id 唯一：icon-<名>（如 icon-sousuo = 放大镜）
     · 坐标系统一 1024x1024（viewBox），保证在不同尺寸下缩放不变形
     · 颜色用 fill="currentColor"，或省略 fill 继承外层 → 跟随文字颜色变色
     新增图标：把图标的 <symbol>（1024 坐标系）粘进来，再在 AppIcon.vue 映射表加一行
     ════════════════════════════════════════════════════════ -->
