<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0969DA" />
    <meta
      name="description"
      content="轻量化的 AI 代码片段管理工具：粘贴即存，支持收藏夹分类、代码解释与 AI 优化。"
    />
    <meta property="og:title" content="Code Snippets · 轻量 AI 代码片段管理" />
    <meta
      property="og:description"
      content="粘贴即存的轻量代码保管工具，内置 DeepSeek AI 代码解释与优化。"
    />
    <meta property="og:type" content="website" />
    <title>Code Snippets · 轻量 AI 代码片段管理</title>
    <!-- 首屏骨架屏：内联 HTML/CSS，先于一切 JS 显示，把"白屏转圈"变成"页面轮廓"。
         形状复刻列表页真实布局（顶栏/侧栏/工具条/卡片）；色值与 zinc 系列一致。
         Vue 挂载后由 App.vue 接力渲染同款骨架（路由 chunk 就绪前），两处共用本段样式 -->
    <style>
      .app-skeleton {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f4f4f5;
      }
      .sk-header {
        height: 56px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: #fff;
        border-bottom: 1px solid #e4e4e7;
      }
      .sk-body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .sk-side {
        display: none;
        width: 240px;
        flex-shrink: 0;
        flex-direction: column;
        gap: 14px;
        padding: 12px;
        background: #fff;
        border-right: 1px solid #e4e4e7;
      }
      @media (min-width: 768px) {
        .sk-side { display: flex; }
      }
      .sk-tagline { display: none; }
      @media (min-width: 1024px) {
        .sk-tagline { display: block; }
      }
      .sk-main { flex: 1; padding: 20px; }
      .sk-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 1024px) {
        .sk-grid { grid-template-columns: 1fr 1fr; }
      }
      .sk-card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .sk-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .sk-bone {
        border-radius: 6px;
        background: #e4e4e7;
        animation: sk-pulse 1.4s ease-in-out infinite;
      }
      .sk-block {
        margin-top: 12px;
        height: 76px;
        border-radius: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        .sk-bone { animation: none; }
      }
      @keyframes sk-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 首屏占位：Vue 挂载后此内容被替换；骨架形状来自列表页真实布局（顶栏/侧栏 w-60/工具条/双列卡片） -->
      <div class="app-skeleton" aria-hidden="true">
        <div class="sk-header">
          <div class="sk-bone" style="width: 130px; height: 20px"></div>
          <div class="sk-bone sk-tagline" style="width: 190px; height: 14px"></div>
        </div>
        <div class="sk-body">
          <aside class="sk-side">
            <div class="sk-bone" style="height: 42px"></div>
            <div class="sk-bone" style="height: 42px"></div>
            <div class="sk-bone" style="width: 65%; height: 14px; margin-top: 8px"></div>
            <div class="sk-bone" style="width: 88%; height: 14px"></div>
            <div class="sk-bone" style="width: 58%; height: 14px"></div>
            <div class="sk-bone" style="width: 76%; height: 14px"></div>
          </aside>
          <main class="sk-main">
            <div class="sk-bone" style="width: 180px; height: 28px"></div>
            <div class="sk-bone" style="width: 100%; max-width: 512px; height: 38px; margin-top: 16px"></div>
            <div class="sk-grid">
              <div class="sk-card">
                <div class="sk-row">
                  <div class="sk-bone" style="width: 56px; height: 20px"></div>
                  <div class="sk-bone" style="width: 18px; height: 18px"></div>
                </div>
                <div class="sk-bone" style="width: 60%; height: 16px"></div>
                <div class="sk-bone sk-block"></div>
              </div>
              <div class="sk-card">
                <div class="sk-row">
                  <div class="sk-bone" style="width: 56px; height: 20px"></div>
                  <div class="sk-bone" style="width: 18px; height: 18px"></div>
                </div>
                <div class="sk-bone" style="width: 45%; height: 16px"></div>
                <div class="sk-bone sk-block"></div>
              </div>
              <div class="sk-card">
                <div class="sk-row">
                  <div class="sk-bone" style="width: 56px; height: 20px"></div>
                  <div class="sk-bone" style="width: 18px; height: 18px"></div>
                </div>
                <div class="sk-bone" style="width: 52%; height: 16px"></div>
                <div class="sk-bone sk-block"></div>
              </div>
              <div class="sk-card">
                <div class="sk-row">
                  <div class="sk-bone" style="width: 56px; height: 20px"></div>
                  <div class="sk-bone" style="width: 18px; height: 18px"></div>
                </div>
                <div class="sk-bone" style="width: 66%; height: 16px"></div>
                <div class="sk-bone sk-block"></div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
